[project]
name = "tempo-backend"
version = "0.1.0"
description = "Tempo private planning backend (Home Assistant is the only UI)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.165",
    "gtfs-realtime-bindings>=2.0",
    "httpx2>=2.16",
    "icalendar>=7.3.2",
    "ortools>=9.15",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "recurring-ical-events>=3.8.2",
    "sqlalchemy>=2.0",
    "tzdata>=2026.6",
    "uvicorn>=0.34",
]

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "types-protobuf>=7.35.1.20261122",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tempo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: requires external services (PostgreSQL, MOTIS); skipped when unavailable"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM", "RUF", "DTZ"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "DTZ001"]

[tool.mypy]
strict = true
python_version = "3.13"
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["recurring_ical_events"]
ignore_missing_imports = true
