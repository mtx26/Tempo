# MOTIS configuration — nationwide Belgium (benchmarked locally 2026-11-23, see README.md).
#
# Realtime goes through the Tempo GTFS-RT relay (backend `tempo.transport.rt_relay`), never
# directly to the Belgian Mobility portal:
#   - the relay holds the bmc-partner-key (Docker secret) and enforces the portal quota, so no
#     key is ever written into this file or into the routing data volume;
#   - the relay repairs TEC (start_time shifted by 12 h: ~50 % of TEC trip updates unusable
#     otherwise) and refuses stale or broken feeds with HTTP 503. With incremental_rt_update:
#     false MOTIS then DROPS its realtime data for that feed (verified live 2026-11-23), so
#     stale delays are never shown as live.
# MOTIS polls the relay every 30 s (internal, free): the relay only calls the portal when its
# own interval has elapsed (Standard key: trip updates 1 min, alerts 5 min, 43 % of the daily
# quota), so each fresh copy reaches MOTIS within 30 s. On HTTP 429 the relay pauses every
# feed; once copies are older than 10 min it answers 503 and MOTIS routes on the static
# timetable.
# Without a key the relay serves only SNCB trip updates (anonymous quota): the other five
# URLs answer 404 and MOTIS logs an error for them — expected, not a failure of Tempo.
# Host `tempo-rt-relay` = Swarm service name; locally use
#   docker run --add-host tempo-rt-relay:host-gateway ...
server:
  port: 8080
osm: /input/osm.pbf
timetable:
  first_day: TODAY
  num_days: 60
  update_interval: 30
  incremental_rt_update: false   # required: see header (stale data must disappear)
  http_timeout: 30
  datasets:
    stib:
      # STIB-MIVB publishes no GTFS-RT: STIB legs are static timetable only.
      path: /input/stib.gtfs.zip
    sncb:
      path: /input/sncb.gtfs.zip
      rt:
        - url: http://tempo-rt-relay:8090/feeds/nmbssncb/trip-updates.pbf
        - url: http://tempo-rt-relay:8090/feeds/nmbssncb/alerts.pbf
    tec:
      path: /input/tec.gtfs.zip
      rt:
        - url: http://tempo-rt-relay:8090/feeds/tec/trip-updates.pbf
        - url: http://tempo-rt-relay:8090/feeds/tec/alerts.pbf
    delijn:
      path: /input/delijn.gtfs.zip
      rt:
        - url: http://tempo-rt-relay:8090/feeds/delijn/trip-updates.pbf
        - url: http://tempo-rt-relay:8090/feeds/delijn/alerts.pbf
street_routing: true
osr_footpath: true
geocoding: false
reverse_geocoding: false
