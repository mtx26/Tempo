# MOTIS configuration — Brussels test region (development only).
# Inputs are mounted read-only at /input; MOTIS writes its imported data to /data.
server:
  port: 8080
osm: /input/osm.pbf
timetable:
  first_day: TODAY
  num_days: 30
  # Anonymous Belgian Mobility quota is 100 requests/day: poll every 30 min (48/day).
  # With a free Standard account key this can drop to 60 s (see docs/TRANSPORT.md).
  update_interval: 1800
  http_timeout: 30
  default_timezone: Europe/Brussels
  datasets:
    stib:
      path: /input/stib.gtfs.zip
    sncb:
      path: /input/sncb.gtfs.zip
      rt:
        - url: https://api-management-discovery-production.azure-api.net/api/gtfs/feed/nmbssncb/rt/trip-update?format=protobuf
street_routing: true
osr_footpath: true
geocoding: false
reverse_geocoding: false
