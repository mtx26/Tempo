# MOTIS configuration — Brussels test region (development only).
# Inputs are mounted read-only at /input; MOTIS writes its imported data to /data.
server:
  port: 8080
osm: /input/osm.pbf
timetable:
  first_day: TODAY
  num_days: 30
  # Realtime only through the Tempo relay (it holds the key and the quota), as in belgium.yml.
  update_interval: 30
  incremental_rt_update: false
  http_timeout: 30
  default_timezone: Europe/Brussels
  datasets:
    stib:
      path: /input/stib.gtfs.zip
    sncb:
      path: /input/sncb.gtfs.zip
      rt:
        - url: http://tempo-rt-relay:8090/feeds/nmbssncb/trip-updates.pbf
        - url: http://tempo-rt-relay:8090/feeds/nmbssncb/alerts.pbf
street_routing: true
osr_footpath: true
geocoding: false
reverse_geocoding: false
