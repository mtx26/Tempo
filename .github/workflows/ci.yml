# CI: tests on every push and pull request; images published to GHCR only after green tests.
#   push to main  -> ghcr.io/<owner>/tempo-{backend,routing,postgres}:latest and :sha-<short>
#   tag vX.Y.Z    -> same images tagged X.Y.Z (the version to pin in Portainer: TEMPO_VERSION)
# Deployment stays manual (Portainer): nothing here touches the server.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Lint, types, tests (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEMPO_TEST_DATABASE_URL: postgresql+psycopg://postgres:ci-only-not-a-secret@localhost:5432/postgres
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install
        run: uv sync --locked
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Types
        run: uv run mypy src tests
      - name: Tests (coverage >= 90 %)
        run: uv run pytest -q --cov=tempo --cov-fail-under=90
      - name: Dependency vulnerability audit
        run: |
          uv export --format requirements-txt --no-hashes --no-emit-project -o "$RUNNER_TEMP/req.txt"
          uvx pip-audit --disable-pip --no-deps -r "$RUNNER_TEMP/req.txt"

  images:
    name: Image ${{ matrix.name }}
    needs: tests
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - {name: tempo-backend, context: backend, file: backend/Dockerfile}
          - {name: tempo-routing, context: routing, file: routing/Dockerfile}
          - {name: tempo-postgres, context: deploy, file: deploy/postgres.Dockerfile}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
