name: backend
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEMPO_TEST_DATABASE_URL: postgresql+psycopg://postgres:ci-only-not-a-secret@localhost:5432/postgres
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src tests
      - run: uv run pytest -q --cov=tempo --cov-fail-under=90
      - name: Dependency vulnerability audit
        run: |
          uv export --format requirements-txt --no-hashes --no-emit-project -o "$RUNNER_TEMP/req.txt"
          uvx pip-audit --disable-pip --no-deps -r "$RUNNER_TEMP/req.txt"

  # Release images on GHCR, only for a version tag (vX.Y.Z) and only after the quality job.
  # Deployment stays manual (Portainer): this job never touches the server.
  images:
    needs: quality
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - {name: tempo-backend, context: backend, file: backend/Dockerfile}
          - {name: tempo-routing, context: routing, file: routing/Dockerfile}
          - {name: tempo-postgres, context: deploy, file: deploy/postgres.Dockerfile}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ steps.version.outputs.value }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
