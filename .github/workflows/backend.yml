name: backend
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src tests
      - run: uv run pytest -q --cov=tempo --cov-fail-under=90
      - name: Dependency vulnerability audit
        run: |
          uv export --format requirements-txt --no-hashes --no-emit-project -o "$RUNNER_TEMP/req.txt"
          uvx pip-audit --disable-pip --no-deps -r "$RUNNER_TEMP/req.txt"
      - name: Dependency vulnerability audit
        run: |
          uv export --format requirements-txt --no-hashes --no-emit-project -o "$RUNNER_TEMP/req.txt"
          uvx pip-audit --disable-pip --no-deps -r "$RUNNER_TEMP/req.txt"
