# Tempo production stack for Docker Swarm (Portainer). NOT DEPLOYED — deploying requires the
# user's explicit approval (CLAUDE.md). Validate with:
#   TEMPO_REGISTRY=... TEMPO_VERSION=... docker stack config -c deploy/stack.yml
# Runbook: README.md "Déploiement Swarm".
#
# Network model (no Tempo port is published; Home Assistant is the only UI):
#   ha       external overlay shared with Home Assistant -> only `api` joins it
#   backend  internal: api, worker, migrate, postgres, backup
#   routing  internal: worker, rt-relay, routing (MOTIS)
#   egress   outbound Internet: worker (iCal, IMAP, LLM), rt-relay (Belgian Mobility portal)

x-hardening: &hardening
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  read_only: true
  tmpfs: [/tmp]

x-backend-image: &backend-image ${TEMPO_REGISTRY:?set TEMPO_REGISTRY}/tempo-backend:${TEMPO_VERSION:?set TEMPO_VERSION}

services:
  postgres:
    image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
    environment:
      POSTGRES_DB: tempo
      POSTGRES_USER: tempo_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/tempo_owner_db_password
    secrets: [tempo_owner_db_password, tempo_app_db_password]
    configs:
      - source: init_roles
        target: /docker-entrypoint-initdb.d/10-roles.sh
        mode: 0555
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tempo_owner -d tempo"]
      interval: 10s
      retries: 10
    networks: [backend]
    deploy:
      replicas: 1
      resources: {limits: {memory: 1G}}
      restart_policy: {condition: any}

  migrate:
    <<: *hardening
    image: *backend-image
    # Owner credentials are used ONLY here; runtime services get tempo_app (DML only).
    command:
      - sh
      - -c
      - python -m tempo.db upgrade && python -m tempo.db grant-runtime tempo_app
    secrets:
      - source: tempo_owner_database_url
        target: tempo_database_url
    networks: [backend]
    deploy:
      mode: replicated-job
      restart_policy: {condition: on-failure, max_attempts: 5, delay: 10s}

  api:
    <<: *hardening
    image: *backend-image
    command: ["python", "-m", "tempo.api"]
    environment:
      # The assistant searches journeys and re-plans synchronously (ARCHITECTURE.md §3).
      TEMPO_MOTIS_URL: http://routing:8080
    secrets: [tempo_api_token, tempo_database_url]
    # Optional: tempo_anthropic_api_key (conversational assistant; without it the deterministic
    # parser answers). During a token rotation add: tempo_api_token_previous.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      retries: 3
    # egress: only needed for the LLM provider when tempo_anthropic_api_key is set.
    networks: [backend, ha, routing, egress]
    deploy:
      replicas: 1  # in-memory auth limiter: exactly one replica
      resources: {limits: {memory: 1G}}
      update_config: {order: stop-first, failure_action: rollback}
      rollback_config: {order: stop-first}

  worker:
    <<: *hardening
    image: *backend-image
    command: ["python", "-m", "tempo.worker"]
    environment:
      TEMPO_MOTIS_URL: http://routing:8080
      # Coach e-mails stay disabled until these are set (README.md, configuration):
      # TEMPO_TRAINING_IMAP_HOST, TEMPO_TRAINING_IMAP_USER, TEMPO_TRAINING_ALLOWED_SENDER,
      # TEMPO_TRAINING_AUTHSERV_ID (receiving server whose DMARC/DKIM verdict is trusted)
    secrets:
      - tempo_database_url
      - tempo_ics_url
      # Optional: tempo_anthropic_api_key, tempo_training_imap_password
    # Alive = one scheduling round finished in the last 5 minutes (a round includes a re-plan).
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/tempo-worker.alive') > 300)"]
      interval: 60s
      start_period: 120s
      retries: 3
    networks: [backend, routing, egress]
    deploy:
      replicas: 1  # jobs are not designed for concurrent workers
      resources: {limits: {memory: 2G}}
      update_config: {order: stop-first, failure_action: rollback}

  rt-relay:
    <<: *hardening
    image: *backend-image
    command: ["python", "-m", "tempo.transport.rt_relay"]
    environment:
      TEMPO_RELAY_STATE_FILE: /state/relay-state.json
    # Standard tier: add the secret tempo_relay_bmc_partner_key (Belgian Mobility key).
    volumes: [relay-state:/state]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health')"]
      interval: 60s
    networks:
      routing:
        aliases: [tempo-rt-relay]
      egress: {}
    deploy:
      replicas: 1  # the request log that enforces the portal quota is per process
      resources: {limits: {memory: 512M}}

  routing-update:
    <<: *hardening
    image: *backend-image
    # Nightly (02:30 UTC) conditional refresh of GTFS (4 feeds) + weekly OSM, validated, atomic;
    # publishes /routing-input/READY only when something changed (ARCHITECTURE.md §7). It runs
    # once at start (empty volume), then every night (`$$` escapes `$` from stack interpolation).
    command:
      - sh
      - -c
      - >-
        while true; do
        python -m tempo.transport.gtfs_update /routing-input || echo 'UPDATE FAILED';
        sleep $$(( ($$(date -u -d 'tomorrow 02:30' +%s) - $$(date -u +%s)) % 86400 + 1 ));
        done
    # Optional: secret tempo_bmc_partner_key (Standard tier) for the portal requests.
    volumes: [routing-input:/routing-input]
    networks: [egress]
    deploy:
      replicas: 1
      resources: {limits: {memory: 1G}}
      # routing-input is a local volume shared with `routing`: both on the same labelled node.
      placement: {constraints: [node.labels.tempo.routing == true]}

  routing:
    <<: *hardening
    image: ${TEMPO_REGISTRY}/tempo-routing:v2.11.4
    # Supervisor: serves /data/current, re-imports into a new graph when READY changes, switches
    # only on success, keeps the previous graph (rollback) and restarts MOTIS if it crashes.
    entrypoint: ["/opt/tempo/supervisor.sh"]
    environment:
      CHECK_SECONDS: "300"
    configs:
      - {source: motis_config, target: /config/config.yml, mode: 0444}
    volumes: [routing-input:/input:ro, routing-data:/data]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/api/v1/health"]
      interval: 60s
      start_period: 600s  # first graph import (national: ~4 min)
      retries: 3
    networks: [routing]
    deploy:
      replicas: 1
      resources: {limits: {memory: 6G}}
      placement: {constraints: [node.labels.tempo.routing == true]}

  backup:
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]  # postgres image entry needs these
    security_opt: ["no-new-privileges:true"]
    image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
    command: ["sh", "-c", "while true; do sh /scripts/backup.sh || echo 'BACKUP FAILED'; sleep 86400; done"]
    environment:
      PGHOST: postgres
      PGUSER: tempo_owner
      PGDATABASE: tempo
      PGPASSWORD_FILE: /run/secrets/tempo_owner_db_password
      BACKUP_DIR: /backups
      BACKUP_KEEP_DAYS: "14"
    secrets: [tempo_owner_db_password]
    configs:
      - {source: backup_sh, target: /scripts/backup.sh, mode: 0555}
      - {source: restore_drill_sh, target: /scripts/restore_drill.sh, mode: 0555}
    volumes: [backups:/backups]
    networks: [backend]
    deploy:
      replicas: 1
      resources: {limits: {memory: 512M}}

configs:
  init_roles: {file: ./db/init-roles.sh}
  motis_config: {file: ../routing/config/belgium.yml}
  backup_sh: {file: ./backup/backup.sh}
  restore_drill_sh: {file: ./backup/restore_drill.sh}

secrets:
  tempo_owner_db_password: {external: true}
  tempo_app_db_password: {external: true}
  tempo_owner_database_url: {external: true}
  tempo_database_url: {external: true}
  tempo_api_token: {external: true}
  tempo_ics_url: {external: true}

volumes:
  pgdata: {}
  relay-state: {}
  backups: {}
  routing-data: {}
  routing-input: {}

networks:
  backend: {driver: overlay, internal: true}
  routing: {driver: overlay, internal: true}
  egress: {driver: overlay}
  ha: {external: true, name: "${TEMPO_HA_NETWORK:-homeassistant_tempo}"}
